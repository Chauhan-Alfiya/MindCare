{% extends "base.html" %}

{% block title %}Edit Resource{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">
            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h4 class="mb-0">

                        Edit Resource

                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Title

                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ resource.title }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Category

                            </label>

                            <input
                                type="text"
                                name="category"
                                class="form-control"
                                value="{{ resource.category }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Language

                            </label>

                            <input
                                type="text"
                                name="language"
                                class="form-control"
                                value="{{ resource.language }}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Description

                            </label>

                            <textarea
                                name="description"
                                rows="5"
                                class="form-control"
                                required>{{ resource.description }}</textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                PDF Path

                            </label>

                            <input
                                type="text"
                                name="file_path"
                                class="form-control"
                                value="{{ resource.file_path }}">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('resources') }}"
                                class="btn btn-secondary">

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning">

                                Update Resource

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
